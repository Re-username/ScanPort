<!DOCTYPE html>
<html lang="ru" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Сканер портов</title>
    <base href="./" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
        // Тема до отрисовки, чтобы не было вспышки светлой темы
        (function () {
            var t = null;
            try { t = localStorage.getItem("portscan-theme"); } catch (e) { }
            if (t !== "dark" && t !== "light") t = "dark";
            if (t === "dark") document.documentElement.classList.add("dark");
            else document.documentElement.classList.remove("dark");
        })();
        window.getTheme = function () {
            try { return localStorage.getItem("portscan-theme") || "dark"; } catch (e) { return "dark"; }
        };
        window.setTheme = function (t) {
            if (t === "dark") document.documentElement.classList.add("dark");
            else document.documentElement.classList.remove("dark");
            try { localStorage.setItem("portscan-theme", t); } catch (e) { }
        };

        // F1 и Esc обрабатываются на уровне окна, включая поля ввода.
        window.portScannerHelp = (function () {
            var reference = null;
            function onKeyDown(event) {
                if (!reference) return;
                if (event.key === "F1") {
                    event.preventDefault();
                    event.stopPropagation();
                    reference.invokeMethodAsync("ShowHelpFromHotkey");
                } else if (event.key === "Escape") {
                    reference.invokeMethodAsync("CloseHelpFromHotkey");
                }
            }
            return {
                init: function (dotNetReference) {
                    if (reference) window.removeEventListener("keydown", onKeyDown, true);
                    reference = dotNetReference;
                    window.addEventListener("keydown", onKeyDown, true);
                },
                dispose: function () {
                    window.removeEventListener("keydown", onKeyDown, true);
                    reference = null;
                }
            };
        })();
    </script>
    <script>
        // Если Blazor не стартовал — показываем ошибку вместо бесконечного спиннера.
        (function () {
            function show(msg) {
                var el = document.getElementById('boot-error');
                if (!el) return;
                el.style.display = 'block';
                el.textContent += msg + '\n';
            }
            window.addEventListener('error', function (e) {
                show((e.message || 'Ошибка загрузки') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
                show('Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
            });
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <div>Загрузка сканера портов…</div>
            <div id="boot-error" style="display:none;max-width:85%;color:#e5534b;font-size:13px;text-align:left;white-space:pre-wrap;"></div>
        </div>
    </div>
    <!-- autostart="false": стартуем Blazor сами. Автостарт на Android иногда срабатывает
         до готовности нативного моста и падает; наш стартер повторяет попытки
         и считает «уже стартовано» успехом. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        (function () {
            var tries = 0;
            function done() { window.__blazorStarted = true; }
            function attempt() {
                if (window.__blazorStarted) return;
                tries++;
                var failed = function (err) {
                    // автостарт (если вдруг сработал) уже запустил Blazor — это успех
                    if (err && /already started/i.test(String(err && err.message || err))) { done(); return; }
                    if (tries < 60) setTimeout(attempt, 200);
                };
                try {
                    var r = Blazor.start();
                    if (r && typeof r.then === 'function') r.then(done, failed);
                    else done();
                } catch (e) { failed(e); }
            }
            attempt();
        })();
    </script>
</body>

</html>
